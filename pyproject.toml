[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dank-farmer"
version = "0.1.0"
description = "Farm Dank Memer coins automatically."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "python-dotenv",
]

[project.scripts]
farm = "main:start"